<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>여기 뭐 생겨요?</title>
  <link href="/style.css" rel="stylesheet" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <script
    defer
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
</head>
<body>
  <div class="topbar">
    <div class="brand">여기 뭐 생겨요?</div>
    <div class="controls">
      <button id="btnLocate">내 위치로</button>
      <label>
        반경(km)
        <input id="radius" type="number" min="0.2" step="0.2" value="2" />
      </label>
      <button id="btnRefresh">주변 조회</button>
    </div>
  </div>

  <div class="layout">
    <div id="map"></div>
    <div class="panel">
      <div class="panel-title">상세</div>
      <div id="detail" class="detail empty">마커를 클릭하면 여기에 정보가 표시됩니다.</div>
      <div class="panel-title">주변 목록</div>
      <div id="list" class="list"></div>
    </div>
  </div>

  <script defer src="/main.js"></script>
</body>
</html>
