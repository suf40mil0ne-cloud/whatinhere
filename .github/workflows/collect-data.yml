name: Collect District Data

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20.18.1'

      - name: Show runner context
        run: |
          echo "pwd=$(pwd)"
          echo "node=$(node -v)"
          echo "npm=$(npm -v)"
          echo "output-before=$(find output -maxdepth 1 -type f | wc -l || true)"

      - name: Validate configured environment names
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          TAGO_API_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          NEIS_ACADEMY_API_KEY: ${{ secrets.NEIS_ACADEMY_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          CHILDCARE_API_KEY: ${{ secrets.CHILDCARE_API_KEY }}
          CCTV_API_KEY: ${{ secrets.CCTV_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for name in DATA_GO_KR_SERVICE_KEY TAGO_API_KEY NEIS_API_KEY NEIS_ACADEMY_API_KEY KAKAO_REST_API_KEY CHILDCARE_API_KEY CCTV_API_KEY CLOUDFLARE_API_TOKEN; do
            if [ -n "${!name}" ]; then
              echo "env:$name=present"
            else
              echo "env:$name=missing"
            fi
          done

      - name: Install dependencies
        run: npm ci

      - name: Run collect pipeline
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          TAGO_API_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          NEIS_API_KEY: ${{ secrets.NEIS_API_KEY }}
          NEIS_ACADEMY_API_KEY: ${{ secrets.NEIS_ACADEMY_API_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          CHILDCARE_API_KEY: ${{ secrets.CHILDCARE_API_KEY }}
          CCTV_API_KEY: ${{ secrets.CCTV_API_KEY }}
        run: |
          npx tsx scripts/02-fetch-transport.ts || echo "transport failed, continuing"
          npx tsx scripts/03-fetch-walk.ts || echo "walk failed, continuing"
          npx tsx scripts/05-fetch-childcare.ts || echo "childcare failed, continuing"
          npx tsx scripts/06-fetch-safety.ts || echo "safety failed, continuing"
          npx tsx scripts/99-merge-scores.ts

      - name: Verify generated artifacts
        run: |
          test -f output/02-transport.sql
          test -f output/03-walk.sql
          test -f output/05-childcare.sql
          test -f output/06-safety.sql
          test -f output/99-final.sql
          ls -lh output/02-transport.sql output/03-walk.sql output/05-childcare.sql output/06-safety.sql output/99-final.sql

      - name: Remove transactions from merged SQL
        run: sed -i '/BEGIN TRANSACTION/d; /COMMIT/d; /SAVEPOINT/d; /ROLLBACK/d' output/99-final.sql

      - name: Upload to Cloudflare D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler d1 execute whatinhere-db --remote --file=output/99-final.sql
