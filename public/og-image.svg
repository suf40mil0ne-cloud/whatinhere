<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- 배경 그라디언트: 지도 느낌 베이지 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F0E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EDE4D0;stop-opacity:1" />
    </linearGradient>
    <!-- 핀 그림자 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000030" />
    </filter>
    <!-- 카드 그림자 -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#00000018" />
    </filter>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- 지도 격자 패턴 (은은한 도로망 느낌) -->
  <g opacity="0.12" stroke="#8B7355" stroke-width="1.5" fill="none">
    <!-- 수평선 -->
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <!-- 수직선 -->
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="450" y1="0" x2="450" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="750" y1="0" x2="750" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
    <!-- 대각선 도로 느낌 -->
    <line x1="0" y1="0" x2="400" y2="630" stroke-width="3" opacity="0.6" />
    <line x1="900" y1="0" x2="1200" y2="210" stroke-width="2.5" opacity="0.5" />
    <line x1="500" y1="0" x2="1200" y2="420" stroke-width="2" opacity="0.4" />
  </g>

  <!-- 중앙 카드 -->
  <rect x="180" y="90" width="840" height="450" rx="28" fill="white" opacity="0.82" filter="url(#cardShadow)" />

  <!-- 상단 브랜드 배지 -->
  <rect x="470" y="118" width="260" height="40" rx="20" fill="#4A6741" opacity="0.9" />
  <text x="600" y="144" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
        font-size="16" font-weight="600" fill="white" text-anchor="middle" letter-spacing="1">
    공공데이터 기반 지도 서비스
  </text>

  <!-- 메인 타이틀 -->
  <text x="600" y="245"
        font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
        font-size="88" font-weight="800" fill="#2D2416"
        text-anchor="middle" letter-spacing="-2">
    여기 뭐 생겨요?
  </text>

  <!-- 지도 핀 3개 -->
  <!-- 왼쪽 핀 (주황) -->
  <g transform="translate(370, 290)" filter="url(#shadow)">
    <ellipse cx="0" cy="62" rx="14" ry="6" fill="#00000020" />
    <path d="M0,-40 C-24,-40 -40,-24 -40,0 C-40,28 0,68 0,68 C0,68 40,28 40,0 C40,-24 24,-40 0,-40 Z"
          fill="#E8703A" />
    <circle cx="0" cy="0" r="16" fill="white" opacity="0.9" />
    <text x="0" y="6" font-size="18" text-anchor="middle" fill="#E8703A">🏗</text>
  </g>

  <!-- 중앙 핀 (메인 초록, 크게) -->
  <g transform="translate(600, 272)" filter="url(#shadow)">
    <ellipse cx="0" cy="76" rx="18" ry="7" fill="#00000025" />
    <path d="M0,-52 C-30,-52 -52,-30 -52,0 C-52,36 0,88 0,88 C0,88 52,36 52,0 C52,-30 30,-52 0,-52 Z"
          fill="#4A6741" />
    <circle cx="0" cy="0" r="20" fill="white" opacity="0.9" />
    <text x="0" y="7" font-size="22" text-anchor="middle" fill="#4A6741">📍</text>
  </g>

  <!-- 오른쪽 핀 (파랑) -->
  <g transform="translate(830, 295)" filter="url(#shadow)">
    <ellipse cx="0" cy="62" rx="14" ry="6" fill="#00000020" />
    <path d="M0,-40 C-24,-40 -40,-24 -40,0 C-40,28 0,68 0,68 C0,68 40,28 40,0 C40,-24 24,-40 0,-40 Z"
          fill="#3A78C8" />
    <circle cx="0" cy="0" r="16" fill="white" opacity="0.9" />
    <text x="0" y="6" font-size="18" text-anchor="middle" fill="#3A78C8">🏢</text>
  </g>

  <!-- 서브텍스트 -->
  <text x="600" y="440"
        font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
        font-size="34" font-weight="400" fill="#5C4A2A" opacity="0.85"
        text-anchor="middle" letter-spacing="1">
    내 주변 공사·개발사업을 한눈에
  </text>

  <!-- 하단 도메인 -->
  <text x="600" y="498"
        font-family="'SF Mono', 'Fira Code', monospace"
        font-size="20" fill="#8B7355" opacity="0.7"
        text-anchor="middle" letter-spacing="2">
    whatsinhere.pages.dev
  </text>

  <!-- 테두리 포인트 장식 -->
  <circle cx="200" cy="110" r="5" fill="#4A6741" opacity="0.4" />
  <circle cx="1000" cy="110" r="5" fill="#4A6741" opacity="0.4" />
  <circle cx="200" cy="520" r="5" fill="#4A6741" opacity="0.4" />
  <circle cx="1000" cy="520" r="5" fill="#4A6741" opacity="0.4" />
</svg>
